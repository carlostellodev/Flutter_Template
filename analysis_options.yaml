# Linting estricto (very_good_analysis). Más duro que flutter_lints:
# obliga buenas prácticas. Si una regla molesta mucho, desactívala abajo.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Código generado: no se lintea (no lo escribes tú).
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # Docs públicas obligatorias es demasiado para apps (tiene sentido en packages).
    public_member_api_docs: false
